[project]
name = "g0vse"
version = "0.1.0"
description = "Making the Swedish government's website (regeringen.se) accessible as open data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "camoufox[geoip] @ git+https://github.com/coryking/camoufox.git@v142.0.1-fork.27#subdirectory=pythonlib",
    "fake-useragent>=2.2.0",
    "html-to-markdown>=2.24.5",
    "selectolax>=0.4.6",
    "tqdm>=4.67.3"
]

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["frontend*", "data*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

