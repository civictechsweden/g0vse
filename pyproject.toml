[project]
name = "g0vse"
version = "0.1.0"
description = "Making the Swedish government's website (regeringen.se) accessible as open data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloverlabs-camoufox[geoip]>=0.6.0",
    "fake-useragent>=2.2.0",
    "html-to-markdown>=2.24.5",
    "playwright<1.61",
    "selectolax>=0.4.6",
    "tqdm>=4.67.3"
]

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["frontend*", "data*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.7",
    "rumdl>=0.2.72",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.rumdl]
# Generated pages may legitimately have unusual heading structure and long lines.
# Restrict automatic formatting to mechanical whitespace/layout fixes.
enable = ["MD009", "MD012", "MD022", "MD031", "MD032", "MD047"]

[tool.pytest.ini_options]
markers = [
    "live: requires a browser and access to external websites",
]
