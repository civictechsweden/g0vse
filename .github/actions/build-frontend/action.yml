name: Build or restore the frontend
description: Reuse the static export for unchanged frontend inputs, rebuilding on a cache miss.

inputs:
  cache:
    description: Reuse and save the compiled frontend; disable for full PR checks.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore compiled frontend
      if: inputs.cache == 'true'
      id: frontend-cache
      uses: actions/cache@v6
      with:
        path: frontend/out
        key: frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/**', '.github/actions/build-frontend/action.yml') }}
    - name: Set up Node.js
      if: inputs.cache != 'true' || steps.frontend-cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install, test and build the frontend
      if: inputs.cache != 'true' || steps.frontend-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm test
        npm run build
