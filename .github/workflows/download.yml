name: Download new pages from regeringen.se
on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * *"
      timezone: "Europe/Stockholm"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: "data"
          path: "data"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - run: uv sync --frozen
      - name: Install browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run camoufox sync
          uv run camoufox set official/stable
          uv run camoufox fetch
      - name: Smoke test page metadata, chains and government agendas
        run: uv run python -m pytest tests -m smoke -q
      - name: Fetch the data
        run: uv run fetch.py
      - name: Commit and Push
        run: |
          cd ./data
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update the data" || echo "Nothing to push"
          git push
