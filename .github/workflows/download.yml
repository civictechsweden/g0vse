name: Download new pages from regeringen.se
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 1AM UTC every day
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: "data"
          path: "data"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"
      - run: uv sync --frozen
      - name: Install browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run camoufox sync
          uv run camoufox set official/stable
          uv run camoufox fetch
      - name: Smoke test page metadata and legislative chains
        run: uv run python -m pytest tests/test_web_parser.py tests/test_chains.py tests/test_chain_enrichment.py tests/test_parser_smoke_live.py -q
      - name: Fetch the data
        run: uv run fetch.py
      - name: Commit and Push
        run: |
          cd ./data
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update the data" || echo "Nothing to push"
          git push
