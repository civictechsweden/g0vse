name: Build the frontend

on:
  push:
    branches: ["master"]
    paths:
      - 'frontend/**'
      - '.github/actions/build-frontend/**'
      - '.github/workflows/build_frontend.yml'
      - '.github/workflows/static.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/actions/build-frontend/**'
      - '.github/workflows/build_frontend.yml'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /frontend/
            /.github/actions/build-frontend/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/build-frontend
        with:
          cache: ${{ github.event_name != 'pull_request' }}
